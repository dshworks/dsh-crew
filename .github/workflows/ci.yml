name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: syntax check every shipped module
        run: |
          for f in lib/*.js src/client/*.js scripts/*.mjs; do node --check "$f"; done
      - name: the bundle patch must name the published package
        # `name` is the specifier the Loader resolves. An unscoped name here
        # boots fine from a linked folder and fails from npm with
        # "Cannot find package" — a break only an installed user would see.
        run: |
          pkg=$(node -p "require('./package.json').name")
          grep -q "name: '$pkg'" cordis.patch.yml
      # `npm test` runs `build-client --check` first, so a stale committed
      # bundle fails here rather than shipping to npm. dist/ is committed on
      # purpose: installing this package must not require a build step.
      - run: npm test
