# A new dsh release should turn this repo red, not quietly drop the plugin.
#
# dsh checks every `@deepseek-ai/dsh*` peer range against its own version when
# a plugin is installed and again when a profile starts, and refuses or disables
# a plugin whose range does not admit it. So each dsh line needs a range that
# names it, and the only proof that counts is the path users take:
# `dsh plugin --profile web add` into a scratch DSH_HOME, on the published dsh.
# `scripts/check-dsh-release.mjs` runs that, and also fails when the install
# puts a copy of a package the host already ships into the profile.
#
# A red scheduled run notifies nobody, so drift opens (or comments on) an issue.
name: dsh-release-watch

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'scripts/check-dsh-release.mjs', '.github/workflows/dsh-release-watch.yml']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `dsh plugin` runs pnpm in the profile directory.
      - run: npm install -g pnpm@11

      # `--tree-only` on a pull request: the published package is still the
      # old one on the very PR that fixes it, so gating a PR on it would
      # make this check red on its own fix. The scheduled run owns that half —
      # it is also the only run that can ever see it clear.
      - id: check
        run: |
          set +e
          node scripts/check-dsh-release.mjs ${{ github.event_name == 'pull_request' && '--tree-only' || '' }} > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
          set -e

      # A pull request wants the answer in its own checks, not in an issue.
      - if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        run: exit 1

      - if: github.event_name != 'pull_request' && steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.check.outputs.status }}" = "2" ]; then
              echo "The daily dsh release check could not finish."
            else
              echo "\`dsh plugin --profile web add\` on current dsh no longer installs this plugin"
              echo "cleanly: dsh refused its peer ranges, or the install put a copy of a package"
              echo "the host already ships into the profile. The report below says which."
              echo
              echo "Fix: port and verify the plugin on the new dsh, then OR its line into the"
              echo "\`@deepseek-ai/dsh*\` peer ranges (or move a host-supplied package from"
              echo "\`dependencies\` to \`peerDependencies\`), and publish. A fix on main that"
              echo "never reaches npm leaves every user on the old package."
            fi
            echo
            cat report.md
          } > issue.md
          # `gh issue list --label` errors on a label that does not exist yet,
          # which would swallow the very first alert.
          gh label create dsh-release --color B60205 --force \
            --description "A dsh release moved out from under this plugin"
          open=$(gh issue list --label dsh-release --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "A dsh release moved out from under this plugin" --label dsh-release --body-file issue.md
          fi
